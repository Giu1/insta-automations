# Render.com blueprint: New -> Blueprint -> select this repo.
services:
  - type: web
    name: insta-automations
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: BRAND_MARKETERMILANO_TOKEN
        sync: false
