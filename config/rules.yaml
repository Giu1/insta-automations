# Comments: public replies on the comment thread.
# DMs: only after the person messages first (Instagram 24h window).
# First matching rule wins. Use match: ["*"] as a fallback (usually last).

brands:
  acme:
    ignore_own_account: true
    comments:
      - match: ["price", "how much", "cost"]
        reply: "Full menu and prices are in the link in bio — thanks for asking!"
      - match: ["hours", "open", "opening"]
        reply: "We're open 8am–6pm Tue–Sun."
    dms:
      - match: ["hours", "open"]
        reply: "We're open 8am–6pm Tue–Sun. Anything else we can help with?"
      - match: ["order", "wholesale"]
        reply: "For orders, email wholesale@example.com and we'll take it from there."
      - match: ["*"]
        reply: "Thanks for messaging Acme! We've got your note and will reply here soon."
    dm_default_once_per_day: true

  studio:
    ignore_own_account: true
    comments:
      - match: ["booking", "book"]
        reply: "Bookings are at the link in bio."
    dms:
      - match: ["*"]
        reply: "Thanks for writing — the studio team will reply in this chat."
    dm_default_once_per_day: true
